name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *" # 6時間ごとにデータを更新して再デプロイ
    # 土日の夜はコンテストの直後にも更新し、コンテストタブに部員の結果(公式順位)を早く載せる
    # (JST 22:45・23:00・23:15・翌0:00 = UTC 13:45・14:00・14:15・15:00。UTC の曜日で 土=6・日=0)
    - cron: "45 13 * * 6,0"
    - cron: "0,15 14 * * 6,0"
    - cron: "0 15 * * 6,0"
  # GitHub の schedule は数時間遅れたり飛ばされたりするので、外部の cron サービス(cron-job.org)から
  # API でこれを呼んで時刻どおりに更新する。設定は docs/auto-update.md
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # テストはコードを変えたとき(push)だけ。データの更新(schedule・外部の cron からの workflow_dispatch)は
      # テストの結果に左右させず、早く終わらせる
      - run: npm test
        if: github.event_name == 'push'
      # 前回のスナップショットを復元し、各部員は差分だけ取得する(kenkoooo負荷軽減)
      - uses: actions/cache@v4
        with:
          path: public/snapshot
          key: snapshot-${{ github.run_id }}
          restore-keys: |
            snapshot-
      - run: node scripts/build-snapshot.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
