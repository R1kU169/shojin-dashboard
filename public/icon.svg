<!-- アプリアイコンの原本。PNG書き出しは scripts/build-icons.mjs -->
<!-- 角丸はOS側が付けるので正方形フルブリード。図形は maskable のセーフゾーン(中心80%の円)内に収めてある -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sb-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d20" />
      <stop offset="1" stop-color="#0a0a0b" />
    </linearGradient>
    <radialGradient id="sb-glow" cx="0.5" cy="0.7" r="0.55">
      <stop offset="0" stop-color="#eb6834" stop-opacity="0.45" />
      <stop offset="0.5" stop-color="#eda100" stop-opacity="0.13" />
      <stop offset="1" stop-color="#eda100" stop-opacity="0" />
    </radialGradient>
    <!-- アプリ背景と同じ方眼紙風ドット -->
    <pattern id="sb-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.05" />
    </pattern>
    <!-- 炎: ヒートマップのランプ(heat-w1..w4)と同じ向きで上が明るい -->
    <linearGradient id="sb-flame" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffd06a" />
      <stop offset="0.38" stop-color="#f7a71f" />
      <stop offset="0.72" stop-color="#f0682f" />
      <stop offset="1" stop-color="#e34948" />
    </linearGradient>
    <filter id="sb-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#sb-tile)" />
  <rect width="512" height="512" fill="url(#sb-dots)" />
  <rect width="512" height="512" fill="url(#sb-glow)" />
  <path
    d="M272 78C298 130 318 158 336 196C349 223 354 260 354 302C354 356.1 308.1 400 256 400C203.9 400 158 356.1 158 302C158 254 186 244 210 224C226 210 232 190 230 160C228 124 248 100 272 78Z"
    fill="#f0682f"
    opacity="0.55"
    filter="url(#sb-soft)"
  />
  <path
    d="M272 78C298 130 318 158 336 196C349 223 354 260 354 302C354 356.1 308.1 400 256 400C203.9 400 158 356.1 158 302C158 254 186 244 210 224C226 210 232 190 230 160C228 124 248 100 272 78Z"
    fill="url(#sb-flame)"
  />
  <!-- 積み上がる精進 -->
  <g fill="#fff8ea">
    <rect x="205" y="308" width="27" height="52" rx="9" />
    <rect x="244" y="272" width="27" height="88" rx="9" />
    <rect x="283" y="236" width="27" height="124" rx="9" />
  </g>
</svg>
